<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATLAB 风格控制终端</title>
    <style>
        /* --- 全局风格设置 (复刻 MATLAB 界面) --- */
        body {
            background-color: #000000; /* 纯黑背景 */
            color: #FFFF00;            /* 黄色文字 */
            font-family: "Brush Script MT", "Times New Roman", cursive, serif; /* 模仿截图字体 */
            font-style: italic;
            margin: 0;
            padding: 20px;
            overflow: hidden; /* 防止滚动条破坏美感 */
        }

        h1, h2, h3 { margin: 5px 0; font-weight: normal; }

        /* 主布局容器：三栏式 */
        .main-container {
            display: grid;
            grid-template-columns: 30% 30% 35%; /* 左中右比例 */
            gap: 20px;
            height: 90vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 通用面板边框风格 */
        .panel-box {
            border: 2px solid #FF0000; /* 红色边框 */
            background-color: #0a0a0a;
            padding: 15px;
            border-radius: 5px;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3); /* 红色发光效果 */
            display: flex;
            flex-direction: column;
        }

        /* 标题风格 */
        .panel-title {
            color: #FFFF00;
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #FFFF00;
        }

        /* --- 左侧：日志区域 --- */
        .log-area {
            flex-grow: 1;
            background-color: #000;
            border: 1px solid #333;
            color: #00FF00; /* 终端绿 */
            font-family: "Consolas", monospace; /* 日志保持等宽字体 */
            font-style: normal;
            font-size: 14px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
        }

        /* --- 中间：控制区域 --- */
        .center-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: none; /* 中间不需要大外框，由内部模块组成 */
            background: transparent;
            box-shadow: none;
        }

        .control-block {
            width: 100%;
            border: 2px solid #FF0000;
            background: #000;
            margin-bottom: 20px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        /* 红色大按钮风格 */
        .matlab-btn {
            background-color: #FF0000;
            color: #FFFF00;
            font-family: inherit;
            font-size: 28px;
            font-style: italic;
            border: 2px solid #FF5555;
            padding: 15px 10px;
            width: 90%;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transition: all 0.2s;
        }

        .matlab-btn:active { transform: scale(0.98); }
        .matlab-btn:disabled { background-color: #550000; color: #888; cursor: not-allowed; }

        /* 模式列表风格 */
        .mode-list {
            list-style: none;
            padding: 0;
            text-align: left;
            font-size: 22px;
            color: #FFF; /* 白色列表项 */
            font-family: "Times New Roman", serif;
        }
        .mode-list li { margin: 10px 0; padding-left: 20px; position: relative; }
        .mode-list li::before { content: "⚪"; position: absolute; left: 0; color: #FFF; font-size: 16px; }
        .mode-list li.active::before { content: "🔴"; color: #FF0000; text-shadow: 0 0 5px red; }

        /* --- 右侧：仪表显示 --- */
        .gauge-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .gauge-box {
            border: 1px solid #FF0000;
            background: #000;
            height: 25%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gauge-label {
            font-size: 26px;
            color: #FFFF00;
            position: absolute;
            top: 5px;
            left: 10px;
        }

        /* 模拟截图中的坐标轴横线 */
        .axis-line {
            width: 90%;
            height: 2px;
            background-color: #555;
            position: relative;
            margin-top: 10px;
        }
        /* 模拟红色指针/刻度 */
        .axis-marker {
            width: 4px;
            height: 20px;
            background-color: #FF0000;
            position: absolute;
            left: 50%; /* 默认居中 */
            top: -10px;
            transition: left 0.3s ease-out;
            box-shadow: 0 0 5px #FF0000;
        }

        .data-value {
            font-size: 40px;
            font-weight: bold;
            color: #FFFF00; /* 黄色数字 */
            font-family: "Courier New", monospace;
            font-style: normal;
            margin-top: 15px;
        }

        /* --- 滚动条样式 --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #FF0000; border-radius: 4px; }

    </style>
</head>
<body>

    <div class="main-container">
        <div class="panel-box">
            <div class="panel-title">LinkState parameters</div>
            <div id="send-log" class="log-area">
                <div>[System] Ready to connect...</div>
            </div>
        </div>

        <div class="center-panel">
            <div class="control-block" style="border: none; background: transparent;">
                <button id="btn-connect" class="matlab-btn">LinkToBlueTooth</button>
            </div>

            <div class="control-block">
                <div class="panel-title" style="font-size: 32px;">WorkingMode</div>
                <ul class="mode-list">
                    <li id="mode-remote" class="active">RemoteControl (WASD)</li>
                    <li id="mode-voice">Mode Q (Toggle)</li>
                    <li id="mode-nav">Mode E (Toggle)</li>
                </ul>
                <div style="margin-top: 15px; font-size: 14px; color: #888; font-style: normal; font-family: sans-serif;">
                    Keyboard: W/A/S/D to Move<br>
                    Q / E to Switch Modes
                </div>
            </div>

            <div class="control-block" style="border: none; background: transparent;">
                <button id="btn-stop" class="matlab-btn" onclick="sendByte(0)">Stop Reading</button>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">ReceiveState parameters</div>
            <div class="log-area" id="receive-log" style="height: 100px; flex-grow: 0; border-bottom: 2px solid red; margin-bottom: 10px;">
                </div>
            
            <div class="gauge-container">
                <div class="gauge-box">
                    <div class="gauge-label">X Position</div>
                    <div class="axis-line"><div id="marker-x" class="axis-marker"></div></div>
                    <div id="val-x" class="data-value">0.00</div>
                </div>

                <div class="gauge-box">
                    <div class="gauge-label">Y Position</div>
                    <div class="axis-line"><div id="marker-y" class="axis-marker"></div></div>
                    <div id="val-y" class="data-value">0.00</div>
                </div>

                <div class="gauge-box">
                    <div class="gauge-label">Yaw Angle</div>
                    <div class="axis-line"><div id="marker-yaw" class="axis-marker"></div></div>
                    <div id="val-yaw" class="data-value">0.0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 核心逻辑保留：自动搜索端口 ---
        const serviceUUID = 0xFFE0;
        let device;
        let writeCharacteristic = null;
        let notifyCharacteristic = null;
        let activeKeys = new Set();
        let isToggledQ = false;
        let isToggledE = false;

        const connectBtn = document.getElementById('btn-connect');
        const sendLogDiv = document.getElementById('send-log');
        const receiveLogDiv = document.getElementById('receive-log');

        function addLog(element, msg, color="#00FF00") {
            const now = new Date().toLocaleTimeString();
            // 限制日志长度防止页面卡顿
            if (element.childElementCount > 50) element.removeChild(element.lastChild);
            element.innerHTML = `<div style="color:${color}">[${now}] ${msg}</div>` + element.innerHTML;
        }

        // 连接逻辑
        connectBtn.addEventListener('click', async () => {
            try {
                writeCharacteristic = null;
                notifyCharacteristic = null;
                addLog(sendLogDiv, "Searching for Bluetooth devices...", "#FFFF00");

                device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [serviceUUID] }]
                });

                const server = await device.gatt.connect();
                addLog(sendLogDiv, "Connected: " + device.name, "#00FF00");

                const service = await server.getPrimaryService(serviceUUID);
                const characteristics = await service.getCharacteristics();

                for (const c of characteristics) {
                    const uuidShort = c.uuid.split('-')[0].slice(4, 8).toUpperCase();
                    
                    if (c.properties.notify) {
                        notifyCharacteristic = c;
                        await c.startNotifications();
                        c.addEventListener('characteristicvaluechanged', handleDataReceived);
                        addLog(receiveLogDiv, `RX Port Bound: 0x${uuidShort}`, "#00FF00");
                    }

                    if (c.properties.write || c.properties.writeWithoutResponse) {
                        writeCharacteristic = c;
                        addLog(sendLogDiv, `TX Port Bound: 0x${uuidShort}`, "#00FF00");
                    }
                }

                if (!writeCharacteristic) addLog(sendLogDiv, "Error: No Write Port!", "#FF0000");
                else {
                    connectBtn.innerText = "Connected";
                    connectBtn.style.backgroundColor = "#228B22";
                    connectBtn.disabled = true; // 防止重复点击
                }

                device.addEventListener('gattserverdisconnected', () => {
                    addLog(sendLogDiv, "Disconnected", "#FF0000");
                    connectBtn.innerText = "LinkToBlueTooth";
                    connectBtn.style.backgroundColor = "#FF0000";
                    connectBtn.disabled = false;
                });

            } catch (error) {
                addLog(sendLogDiv, "Error: " + error, "#FF0000");
            }
        });

        // 发送逻辑
        async function sendByte(value) {
            if (!writeCharacteristic) return;
            try {
                const buffer = new Uint8Array([value]);
                if (writeCharacteristic.properties.writeWithoutResponse) {
                    await writeCharacteristic.writeValueWithoutResponse(buffer);
                } else {
                    await writeCharacteristic.writeValueWithResponse(buffer);
                }
            } catch (error) {
                addLog(sendLogDiv, "Send Fail: " + error.message, "#FF0000");
            }
        }

        // 键盘逻辑 (W/A/S/D)
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();
            
            if (['w', 'a', 's', 'd'].includes(key)) {
                activeKeys.add(key);
                let cmd = 0;
                let logMsg = "";
                if (key === 'w') { cmd = 1; logMsg = "Forward"; }
                if (key === 's') { cmd = 2; logMsg = "Backward"; }
                if (key === 'a') { cmd = 3; logMsg = "Left"; }
                if (key === 'd') { cmd = 4; logMsg = "Right"; }
                
                addLog(sendLogDiv, `TX: ${logMsg} (0${cmd})`, "#FFFF00");
                sendByte(cmd);
                
                // 高亮 UI 列表
                document.getElementById('mode-remote').classList.add('active');
            } 
            else if (key === 'q') {
                isToggledQ = !isToggledQ;
                const cmd = isToggledQ ? 5 : 6;
                addLog(sendLogDiv, `TX: Mode Q ${isToggledQ?'On':'Off'}`, "#00FFFF");
                sendByte(cmd);
                toggleList('mode-voice', isToggledQ);
            } 
            else if (key === 'e') {
                isToggledE = !isToggledE;
                const cmd = isToggledE ? 7 : 8;
                addLog(sendLogDiv, `TX: Mode E ${isToggledE?'On':'Off'}`, "#00FFFF");
                sendByte(cmd);
                toggleList('mode-nav', isToggledE);
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (activeKeys.has(key)) {
                activeKeys.delete(key);
                if (activeKeys.size === 0) {
                    addLog(sendLogDiv, "TX: Stop (00)", "#888");
                    sendByte(0);
                }
            }
        });

        function toggleList(id, isActive) {
            const el = document.getElementById(id);
            if (isActive) el.classList.add('active');
            else el.classList.remove('active');
        }

        // 数据接收与仪表更新
        function handleDataReceived(event) {
            const data = event.target.value;
            if (data.byteLength >= 16) {
                if (data.getUint8(0) === 0x55 && data.getUint8(1) === 0x00) {
                    const x = data.getFloat32(2, true);
                    const y = data.getFloat32(6, true);
                    const yaw = data.getFloat32(10, true);

                    // 1. 更新数值文本
                    document.getElementById('val-x').innerText = x.toFixed(2);
                    document.getElementById('val-y').innerText = y.toFixed(2);
                    document.getElementById('val-yaw').innerText = yaw.toFixed(1);

                    // 2. 更新“红色指针”位置 (简单的视觉模拟)
                    // 假设 X/Y 范围是 -100 到 100，Yaw 是 -180 到 180
                    // 计算 left 百分比: (val - min) / (max - min) * 100
                    
                    const mapToPercent = (val, min, max) => {
                        let pct = ((val - min) / (max - min)) * 100;
                        pct = Math.max(0, Math.min(100, pct)); // 限制在 0-100%
                        return pct + "%";
                    };

                    document.getElementById('marker-x').style.left = mapToPercent(x, -500, 500); // 假设范围
                    document.getElementById('marker-y').style.left = mapToPercent(y, -500, 500); 
                    document.getElementById('marker-yaw').style.left = mapToPercent(yaw, -180, 180);

                    // 更新日志
                    // addLog(receiveLogDiv, `X:${x.toFixed(1)} Y:${y.toFixed(1)}`, "#ccc");
                }
            }
        }
    </script>
</body>
</html>
