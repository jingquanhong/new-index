<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MATLAB 风格控制终端</title>
    <style>
        /* --- 全局风格设置 (复刻 MATLAB 界面) --- */
        body {
            background-color: #000000;
            color: #FFFF00;
            font-family: "Brush Script MT", "Times New Roman", cursive, serif;
            font-style: italic;
            margin: 0;
            padding: 10px;
            overflow: hidden; 
            touch-action: manipulation;
        }

        h1, h2, h3 { margin: 5px 0; font-weight: normal; }

        .main-container {
            display: grid;
            grid-template-columns: 30% 30% 35%;
            gap: 20px;
            height: 95vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 800px) {
            .main-container {
                display: flex;
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            body { overflow: auto; }
            .panel-box { margin-bottom: 20px; height: 300px; }
            .log-area { height: 150px; }
        }

        .panel-box {
            border: 2px solid #FF0000;
            background-color: #0a0a0a;
            padding: 15px;
            border-radius: 5px;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            color: #FFFF00;
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #FFFF00;
        }

        .log-area {
            flex-grow: 1;
            background-color: #000;
            border: 1px solid #333;
            color: #00FF00;
            font-family: "Consolas", monospace;
            font-style: normal;
            font-size: 14px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
        }

        .center-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
        }

        .control-block {
            width: 100%;
            border: 2px solid #FF0000;
            background: #000;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .matlab-btn {
            background-color: #FF0000;
            color: #FFFF00;
            font-family: inherit;
            font-size: 24px;
            font-style: italic;
            border: 2px solid #FF5555;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }
        .matlab-btn:active { transform: scale(0.98); }
        .matlab-btn:disabled { background-color: #550000; color: #888; }

        /* --- 屏幕虚拟按键区域 --- */
        .d-pad-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .pad-btn {
            background: #111;
            border: 2px solid #FF0000;
            color: #FFFF00;
            font-size: 28px;
            font-weight: bold;
            font-family: "Consolas", monospace;
            font-style: normal;
            height: 60px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.3);
            user-select: none;
            -webkit-user-select: none;
        }

        .pad-btn:active, .pad-btn.active-touch {
            background-color: #FF0000;
            color: #000;
            box-shadow: 0 0 15px #FF0000;
        }

        /* 底部功能键容器：用于并排 Z 和 X */
        .func-row {
            grid-column: 1 / -1; /* 横跨所有列 */
            display: flex;
            gap: 10px;
        }
        .func-btn {
            flex: 1; /* 平分宽度 */
            background: #220000; /* 深红背景区分功能键 */
            font-size: 24px;
        }

        .mode-list {
            list-style: none;
            padding: 0;
            text-align: left;
            font-size: 20px;
            color: #FFF;
            font-family: "Times New Roman", serif;
        }
        .mode-list li { margin: 5px 0; padding-left: 20px; position: relative; }
        .mode-list li::before { content: "⚪"; position: absolute; left: 0; color: #FFF; font-size: 14px; }
        .mode-list li.active::before { content: "🔴"; color: #FF0000; text-shadow: 0 0 5px red; }

        .gauge-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .gauge-box {
            border: 1px solid #FF0000;
            background: #000;
            height: 80px;
            margin-bottom: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .gauge-label { font-size: 20px; color: #FFFF00; position: absolute; top: 2px; left: 5px; }
        .axis-line { width: 90%; height: 2px; background-color: #555; position: relative; margin-top: 10px; }
        .axis-marker { width: 4px; height: 16px; background-color: #FF0000; position: absolute; left: 50%; top: -8px; transition: left 0.1s linear; box-shadow: 0 0 5px #FF0000; }
        .data-value { font-size: 32px; font-weight: bold; color: #FFFF00; font-family: "Courier New", monospace; font-style: normal; margin-top: 5px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #FF0000; border-radius: 3px; }

    </style>
</head>
<body>

    <div class="main-container">
        <div class="panel-box">
            <div class="panel-title">LinkState</div>
            <div id="send-log" class="log-area">
                <div>[System] Ready...</div>
            </div>
        </div>

        <div class="center-panel">
            <div class="control-block" style="border: none; background: transparent; padding: 0;">
                <button id="btn-connect" class="matlab-btn">LinkToBlueTooth</button>
            </div>

            <div class="control-block">
                <div class="panel-title" style="font-size: 24px;">Direct Control</div>
                <div class="d-pad-container">
                    <div id="pad-q" class="pad-btn" data-key="q">Q</div>
                    <div id="pad-w" class="pad-btn" data-key="w">W</div>
                    <div id="pad-e" class="pad-btn" data-key="e">E</div>
                    
                    <div id="pad-a" class="pad-btn" data-key="a">A</div>
                    <div id="pad-s" class="pad-btn" data-key="s">S</div>
                    <div id="pad-d" class="pad-btn" data-key="d">D</div>

                    <div class="func-row">
                        <div id="pad-z" class="pad-btn func-btn" data-key="z">Z (53)</div>
                        <div id="pad-x" class="pad-btn func-btn" data-key="x">X (54)</div>
                    </div>
                </div>
            </div>

            <div class="control-block">
                <div class="panel-title" style="font-size: 24px;">Mode Status</div>
                <ul class="mode-list">
                    <li id="mode-remote" class="active">Remote (WASD)</li>
                    <li id="mode-voice">Mode Q (Toggle)</li>
                    <li id="mode-nav">Mode E (Toggle)</li>
                </ul>
            </div>

            <div class="control-block" style="border: none; background: transparent; padding: 0;">
                <button id="btn-stop" class="matlab-btn" onclick="sendByte(0)">Stop Reading</button>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">Sensors</div>
            <div class="log-area" id="receive-log" style="height: 80px; flex-grow: 0; border-bottom: 2px solid red; margin-bottom: 10px;"></div>
            
            <div class="gauge-container">
                <div class="gauge-box">
                    <div class="gauge-label">X Pos</div>
                    <div class="axis-line"><div id="marker-x" class="axis-marker"></div></div>
                    <div id="val-x" class="data-value">0.00</div>
                </div>
                <div class="gauge-box">
                    <div class="gauge-label">Y Pos</div>
                    <div class="axis-line"><div id="marker-y" class="axis-marker"></div></div>
                    <div id="val-y" class="data-value">0.00</div>
                </div>
                <div class="gauge-box">
                    <div class="gauge-label">Yaw</div>
                    <div class="axis-line"><div id="marker-yaw" class="axis-marker"></div></div>
                    <div id="val-yaw" class="data-value">0.0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const serviceUUID = 0xFFE0;
        let device;
        let writeCharacteristic = null;
        let notifyCharacteristic = null;
        let activeKeys = new Set();
        let isToggledQ = false;
        let isToggledE = false;

        const connectBtn = document.getElementById('btn-connect');
        const sendLogDiv = document.getElementById('send-log');
        const receiveLogDiv = document.getElementById('receive-log');

        function addLog(element, msg, color="#00FF00") {
            const now = new Date().toLocaleTimeString();
            if (element.childElementCount > 30) element.removeChild(element.lastChild);
            element.innerHTML = `<div style="color:${color}">[${now}] ${msg}</div>` + element.innerHTML;
        }

        // --- 蓝牙连接逻辑 ---
        connectBtn.addEventListener('click', async () => {
            try {
                writeCharacteristic = null;
                addLog(sendLogDiv, "Searching...", "#FFFF00");
                device = await navigator.bluetooth.requestDevice({ filters: [{ services: [serviceUUID] }] });
                const server = await device.gatt.connect();
                addLog(sendLogDiv, "Connected: " + device.name, "#00FF00");
                const service = await server.getPrimaryService(serviceUUID);
                const characteristics = await service.getCharacteristics();

                for (const c of characteristics) {
                    if (c.properties.notify) {
                        notifyCharacteristic = c;
                        await c.startNotifications();
                        c.addEventListener('characteristicvaluechanged', handleDataReceived);
                    }
                    if (c.properties.write || c.properties.writeWithoutResponse) {
                        writeCharacteristic = c;
                        addLog(sendLogDiv, "TX Ready", "#00FF00");
                    }
                }
                
                if (writeCharacteristic) {
                    connectBtn.innerText = "Connected";
                    connectBtn.style.backgroundColor = "#228B22";
                    connectBtn.disabled = true;
                }
            } catch (error) {
                addLog(sendLogDiv, "Err: " + error, "#FF0000");
            }
        });

        async function sendByte(value) {
            if (!writeCharacteristic) return;
            try {
                const buffer = new Uint8Array([value]);
                if (writeCharacteristic.properties.writeWithoutResponse) {
                    await writeCharacteristic.writeValueWithoutResponse(buffer);
                } else {
                    await writeCharacteristic.writeValueWithResponse(buffer);
                }
            } catch (error) {
                addLog(sendLogDiv, "Send Fail", "#FF0000");
            }
        }

        // --- 逻辑封装 ---
        function handleMove(cmd, name) {
            addLog(sendLogDiv, `TX: ${name} (0${cmd})`, "#FFFF00");
            sendByte(cmd);
            document.getElementById('mode-remote').classList.add('active');
        }

        function handleStop() {
            addLog(sendLogDiv, "TX: Stop (00)", "#888");
            sendByte(0);
        }

        function toggleQ() {
            isToggledQ = !isToggledQ;
            const cmd = isToggledQ ? 5 : 6;
            addLog(sendLogDiv, `TX: Mode Q ${isToggledQ?'On':'Off'}`, "#00FFFF");
            sendByte(cmd);
            toggleListUI('mode-voice', isToggledQ);
        }

        function toggleE() {
            isToggledE = !isToggledE;
            const cmd = isToggledE ? 7 : 8;
            addLog(sendLogDiv, `TX: Mode E ${isToggledE?'On':'Off'}`, "#00FFFF");
            sendByte(cmd);
            toggleListUI('mode-nav', isToggledE);
        }

        function toggleListUI(id, isActive) {
            const el = document.getElementById(id);
            if (isActive) el.classList.add('active');
            else el.classList.remove('active');
        }

        // --- 物理键盘逻辑 ---
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();
            
            // UI按键高亮效果
            const uiBtn = document.querySelector(`.pad-btn[data-key="${key}"]`);
            if (uiBtn) uiBtn.classList.add('active-touch');

            if (key === 'w') { activeKeys.add('w'); handleMove(1, "Forward"); }
            if (key === 's') { activeKeys.add('s'); handleMove(2, "Backward"); }
            if (key === 'a') { activeKeys.add('a'); handleMove(3, "Left"); }
            if (key === 'd') { activeKeys.add('d'); handleMove(4, "Right"); }
            if (key === 'q') toggleQ();
            if (key === 'e') toggleE();

            // --- Z 和 X 键逻辑 ---
            if (key === 'z') {
                addLog(sendLogDiv, "TX: Z-Func (53)", "#FF00FF");
                sendByte(53);
            }
            // --- 新增 X 键 ---
            if (key === 'x') {
                addLog(sendLogDiv, "TX: X-Func (54)", "#FF00FF");
                sendByte(54);
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            
            // 移除UI高亮
            const uiBtn = document.querySelector(`.pad-btn[data-key="${key}"]`);
            if (uiBtn) uiBtn.classList.remove('active-touch');

            // 注意：Z 和 X 键不需要在松开时触发停止
            if (['w','a','s','d'].includes(key)) {
                activeKeys.delete(key);
                if (activeKeys.size === 0) handleStop();
            }
        });

        // --- 屏幕触摸按键逻辑 (支持手机多点触控) ---
        // 为所有 .pad-btn 添加事件
        document.querySelectorAll('.pad-btn').forEach(btn => {
            const key = btn.dataset.key;

            // 按下事件
            const startAction = (e) => {
                e.preventDefault(); 
                btn.classList.add('active-touch');
                
                if (key === 'w') handleMove(1, "Forward");
                if (key === 's') handleMove(2, "Backward");
                if (key === 'a') handleMove(3, "Left");
                if (key === 'd') handleMove(4, "Right");
                if (key === 'q') toggleQ();
                if (key === 'e') toggleE();
                
                // --- Z 和 X 触摸逻辑 ---
                if (key === 'z') {
                    addLog(sendLogDiv, "TX: Z-Func (53)", "#FF00FF");
                    sendByte(53);
                }
                if (key === 'x') {
                    addLog(sendLogDiv, "TX: X-Func (54)", "#FF00FF");
                    sendByte(54);
                }
            };

            // 松开事件
            const endAction = (e) => {
                e.preventDefault();
                btn.classList.remove('active-touch');

                // 只有 WASD 需要松开停止
                if (['w','a','s','d'].includes(key)) {
                    handleStop();
                }
            };

            btn.addEventListener('mousedown', startAction);
            btn.addEventListener('touchstart', startAction);

            btn.addEventListener('mouseup', endAction);
            btn.addEventListener('touchend', endAction);
            btn.addEventListener('mouseleave', (e) => {
                 if(['w','a','s','d'].includes(key) && btn.classList.contains('active-touch')) {
                     endAction(e);
                 }
            });
        });

        // --- 数据解析 ---
        function handleDataReceived(event) {
            const data = event.target.value;
            if (data.byteLength >= 16 && data.getUint8(0) === 0x55) {
                const x = data.getFloat32(2, true);
                const y = data.getFloat32(6, true);
                const yaw = data.getFloat32(10, true);

                document.getElementById('val-x').innerText = x.toFixed(2);
                document.getElementById('val-y').innerText = y.toFixed(2);
                document.getElementById('val-yaw').innerText = yaw.toFixed(1);

                const mapToPercent = (val, min, max) => {
                    let pct = ((val - min) / (max - min)) * 100;
                    return Math.max(0, Math.min(100, pct)) + "%";
                };

                document.getElementById('marker-x').style.left = mapToPercent(x, -500, 500);
                document.getElementById('marker-y').style.left = mapToPercent(y, -500, 500);
                document.getElementById('marker-yaw').style.left = mapToPercent(yaw, -180, 180);
            }
        }
    </script>
</body>
</html>
